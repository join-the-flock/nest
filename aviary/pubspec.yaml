name: aviary
description: "An app for managing your Flutter nests."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  git: ^2.3.2
  http: ^1.5.0
  grid_paper: ^0.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  super_editor: 0.3.0-dev.34

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: fira-mono
      fonts:
        - asset: assets/fonts/Fira_Mono/FiraMono-Regular.ttf
        - asset: assets/fonts/Fira_Mono/FiraMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fira_Mono/FiraMono-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
