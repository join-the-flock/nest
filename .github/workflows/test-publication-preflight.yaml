name: Test Nest tools

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'nest_patches/**'
      - '.github/actions/assemble-flock/action.yaml'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/test-publication-preflight.yaml'
      - '.github/workflows/daily-flock-rebase.yaml'
      - '.github/workflows/build-and-upload-engine-variants.yaml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'nest_patches/**'
      - '.github/actions/assemble-flock/action.yaml'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/test-publication-preflight.yaml'
      - '.github/workflows/daily-flock-rebase.yaml'
      - '.github/workflows/build-and-upload-engine-variants.yaml'

permissions:
  contents: read

jobs:
  test-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Nest
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve Nest dependencies
        run: dart pub get --enforce-lockfile

      - name: Resolve patch package dependencies
        working-directory: nest_patches
        run: dart pub get --enforce-lockfile

      - name: Analyze and test Nest tools
        run: |
          dart analyze tools/flock_publication_preflight_checks.dart test
          dart test

      - name: Analyze and test patch package
        working-directory: nest_patches
        run: |
          dart analyze
          dart test
