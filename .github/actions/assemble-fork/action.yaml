name: Assemble Fork
description: >-
  Check out an upstream Flutter revision into the configured fork directory and
  apply an ordered patch collection. Requires Dart to be set up by the calling workflow.
inputs:
  flutter_ref:
    required: true
    description: >-
      Upstream Flutter branch, tag, or revision to use as the fork's base
      (typically the most recent commit on either master, stable, or beta).
  flutter_repo:
    required: false
    default: flutter/flutter
    description: GitHub repository to use as the fork's upstream base (usually flutter/flutter)
  fork_path:
    required: true
    description: >-
      Workspace directory path where the fork will be created (e.g., "flock" for Flock). Pass 
      the same path to subsequent engine build and publication actions.
  patches_path:
    required: false
    default: patches
    description: >-
      Workspace directory path where the fork's patch files will be checked out. Defaults to "patches".
  patches_repo:
    required: true
    description: GitHub repository containing the fork's patches.
  patches_ref:
    required: false
    default: main
    description: Patch repository branch, tag, or revision.
  patches_manifest:
    required: false
    default: .patches
    description: File name of the patch manifest to use for this fork build.
  git_user_name:
    required: true
    description: Git author and committer name for assembly commits
  git_user_email:
    required: true
    description: Git author and committer email for assembly commits
  token:
    required: false
    default: ${{ github.token }}
    description: >-
      An access token, such as a personal access token (PAT) or organization token,
      with read access to the upstream and patch repositories. If the assembled
      checkout will later be published, the token also needs write access to the
      destination fork. This action does not push, but checkout persists the
      credentials used by subsequent publication steps, so supply the publishing
      token up front during checkout and assembly.
  fetch_depth:
    required: false
    default: '0'
    description: >-
      Git fetch depth for the upstream checkout. Assembly walks engine history
      to select an engine hash. Zero fetches full history; a shallow checkout
      (depth 1 or greater) can select an unexpected engine hash. Use shallow
      history at your own discretion.

runs:
  using: composite
  steps:
    - name: Resolve Nest tooling dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: dart pub get --enforce-lockfile

    - name: Resolve patch package dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../../../nest_patches
      run: dart pub get --enforce-lockfile

    - name: Check out upstream Flutter
      uses: actions/checkout@v4
      with:
        path: ${{ inputs.fork_path }}
        fetch-depth: ${{ inputs.fetch_depth }}
        repository: ${{ inputs.flutter_repo }}
        ref: ${{ inputs.flutter_ref }}
        token: ${{ inputs.token }}

    - name: Check out fork patches
      uses: actions/checkout@v4
      with:
        path: ${{ inputs.patches_path }}
        repository: ${{ inputs.patches_repo }}
        ref: ${{ inputs.patches_ref }}
        token: ${{ inputs.token }}

    # Pin the engine version so the Flutter tool can find a precompiled engine.
    - name: Save engine hash
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}
      env:
        GIT_USER_NAME: ${{ inputs.git_user_name }}
        GIT_USER_EMAIL: ${{ inputs.git_user_email }}
      run: |
        set -euo pipefail
        git config user.name "$GIT_USER_NAME"
        git config user.email "$GIT_USER_EMAIL"
        ./bin/internal/update_engine_version.sh
        cp ./bin/cache/engine.stamp ./bin/internal/engine.version
        git add -f ./bin/internal/engine.version
        git commit -m "save engine version" --allow-empty

    - name: Apply fork patches
      shell: bash
      env:
        FORK_PATH: ${{ github.workspace }}/${{ inputs.fork_path }}
        PATCHES_PATH: ${{ github.workspace }}/${{ inputs.patches_path }}
        PATCHES_MANIFEST: ${{ inputs.patches_manifest }}
        PATCH_LOG: ${{ github.workspace }}/patch_fail.log
        PATCH_TOOL: ${{ github.action_path }}/../../../nest_patches/bin/git_import_patches.dart
      run: |
        set -euo pipefail
        if ! dart run "$PATCH_TOOL" --flutter "$FORK_PATH" -p "$PATCHES_PATH" --manifest "$PATCHES_MANIFEST" -3 2> "$PATCH_LOG"; then
          echo "::error::Patch import failed. Showing conflicts and context…"
          echo "::group::Last 200 lines of patch import stderr"
          tail -n 200 "$PATCH_LOG" || true
          echo "::endgroup::"
          echo "::group::Git status (fork checkout)"
          git -C "$FORK_PATH" status --porcelain=v1 || true
          git -C "$FORK_PATH" diff --name-only --diff-filter=U || true
          echo "::endgroup::"
          echo "::group::Conflict details"
          git -C "$FORK_PATH" diff --cc || true
          echo "::endgroup::"
          exit 1
        fi
