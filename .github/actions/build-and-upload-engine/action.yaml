name: Build and Upload Engine
description: >-
  Build a Flutter fork's engine with a selected gclient setup and Engine Tool
  configuration, and optionally upload its artifacts to Google Cloud Storage.
inputs:
  fork_path:
    required: false
    default: fork
    description: SDK checkout path relative to the workflow workspace
  gclient:
    required: true
    description: >-
      Name of the gclient configuration in the SDK checkout's engine/scripts
      directory, without the .gclient suffix. Nest's example workflows use slim
      configurations to reduce checkout size so engine builds can fit on a
      standard GitHub runner.
  config_name:
    required: true
    description: >-
      Name of a Flutter Engine Tool (et) configuration, as defined in a builder
      configuration under engine/src/flutter/ci/builders.
  engine_version:
    required: true
    description: >-
      Engine hash used to identify the uploaded artifacts. It should match the
      engine version pinned in the assembled fork that will consume these builds,
      so the Flutter tool can locate the corresponding precompiled engine.
  gcp_credentials:
    required: false
    default: ''
    description: >-
      Base64-encoded Google Cloud service account JSON credentials with access
      to the bucket storing the engine binaries. Leave empty to use credentials
      already configured on the runner.
  gcp_bucket:
    required: false
    default: ''
    description: >-
      Google Cloud Storage bucket for engine build binaries, published in the
      artifact layout expected by the Flutter tool for downloads. Leave empty
      to build without uploading.

runs:
  using: composite
  steps:
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        version: '>= 363.0.0'

    - name: Authenticate gcloud
      if: ${{ inputs.gcp_bucket != '' && inputs.gcp_credentials != '' }}
      shell: bash
      env:
        GCP_CREDENTIALS: ${{ inputs.gcp_credentials }}
      run: |
        set -euo pipefail
        echo "$GCP_CREDENTIALS" | base64 -d > "$HOME/gcloud.json"
        gcloud auth activate-service-account --key-file="$HOME/gcloud.json"

    - name: Free disk space
      shell: bash
      if: runner.os == 'Linux'
      run: curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Android sysroot
      if: contains(inputs.config_name, 'android')
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}
      run: engine/src/build/linux/sysroot_scripts/install-sysroot.py --arch=x64

    - name: Set up depot_tools / gclient
      shell: bash
      run: |
        set -euo pipefail
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
        # Append depot_tools to PATH for subsequent steps.
        echo "$HOME/depot_tools" >> "$GITHUB_PATH"

    # Use the selected gclient configuration to limit engine checkout size.
    - name: Copy gclient file
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}
      env:
        GCLIENT: ${{ inputs.gclient }}
      run: cp "engine/scripts/$GCLIENT.gclient" .gclient

    - name: Gclient sync
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}
      run: gclient sync -D

    - name: Fetch engine dependencies
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}/engine/src
      run: ./flutter/bin/et fetch

    - name: Build engine
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}/engine/src
      env:
        CONFIG_NAME: ${{ inputs.config_name }}
      run: ./flutter/bin/et build --config "$CONFIG_NAME"

    # Publish under the engine hash in the artifact layout used by the Flutter tool.
    - name: Copy zip archives
      if: ${{ inputs.gcp_bucket != '' && !contains(inputs.config_name, 'test') && hashFiles(format('{0}/engine/src/out/{1}/zip_archives/**', inputs.fork_path, inputs.config_name)) != '' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}/engine/src
      env:
        CONFIG_NAME: ${{ inputs.config_name }}
        GCP_BUCKET: ${{ inputs.gcp_bucket }}
        ENGINE_VERSION: ${{ inputs.engine_version }}
      run: gcloud storage cp --recursive "out/$CONFIG_NAME/zip_archives/"* "gs://$GCP_BUCKET/flutter_infra_release/flutter/engine/$ENGINE_VERSION/"

    - name: Copy engine outputs
      if: ${{ inputs.gcp_bucket != '' && !contains(inputs.config_name, 'test') && hashFiles(format('{0}/engine/src/out/{1}/zip_archives/**', inputs.fork_path, inputs.config_name)) == '' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}/engine/src
      env:
        CONFIG_NAME: ${{ inputs.config_name }}
        GCP_BUCKET: ${{ inputs.gcp_bucket }}
        ENGINE_VERSION: ${{ inputs.engine_version }}
      run: |
        set -euo pipefail
        tar c "out/$CONFIG_NAME" | gzip > "out/$CONFIG_NAME.tar.gz"
        gcloud storage cp --recursive "out/$CONFIG_NAME.tar.gz" "gs://$GCP_BUCKET/flutter_infra_release/flutter/engine/$ENGINE_VERSION/$CONFIG_NAME.tar.gz"
