name: Build and Upload Engine
description: Build a Flutter fork's engine and optionally upload its artifacts to GCS
inputs:
  fork_path:
    required: false
    default: fork
    description: SDK checkout path relative to the workflow workspace
  gclient:
    required: true
    description: Configuration name from the SDK checkout's engine/scripts directory
  config_name:
    required: true
    description: Flutter Engine Tool configuration from engine/src/flutter/ci/builders
  engine_version:
    required: true
    description: Engine hash used to identify the uploaded artifacts
  gcp_credentials:
    required: false
    default: ''
    description: Base64-encoded service account credentials for the destination bucket
  gcp_bucket:
    required: false
    default: ''
    description: Destination GCS bucket; leave empty to build without uploading

runs:
  using: composite
  steps:
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        version: '>= 363.0.0'

    - name: Authenticate gcloud
      if: ${{ inputs.gcp_bucket != '' && inputs.gcp_credentials != '' }}
      shell: bash
      env:
        GCP_CREDENTIALS: ${{ inputs.gcp_credentials }}
      run: |
        set -euo pipefail
        echo "$GCP_CREDENTIALS" | base64 -d > "$HOME/gcloud.json"
        gcloud auth activate-service-account --key-file="$HOME/gcloud.json"

    - name: Free disk space
      shell: bash
      if: runner.os == 'Linux'
      run: curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Android sysroot
      if: contains(inputs.config_name, 'android')
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}
      run: engine/src/build/linux/sysroot_scripts/install-sysroot.py --arch=x64

    - name: Set up depot_tools / gclient
      shell: bash
      run: |
        set -euo pipefail
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
        echo "$HOME/depot_tools" >> "$GITHUB_PATH"

    - name: Copy gclient file
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}
      env:
        GCLIENT: ${{ inputs.gclient }}
      run: cp "engine/scripts/$GCLIENT.gclient" .gclient

    - name: Gclient sync
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}
      run: gclient sync -D

    - name: Fetch engine dependencies
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}/engine/src
      run: ./flutter/bin/et fetch

    - name: Build engine
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}/engine/src
      env:
        CONFIG_NAME: ${{ inputs.config_name }}
      run: ./flutter/bin/et build --config "$CONFIG_NAME"

    - name: Copy zip archives
      if: ${{ inputs.gcp_bucket != '' && !contains(inputs.config_name, 'test') && hashFiles(format('{0}/engine/src/out/{1}/zip_archives/**', inputs.fork_path, inputs.config_name)) != '' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}/engine/src
      env:
        CONFIG_NAME: ${{ inputs.config_name }}
        GCP_BUCKET: ${{ inputs.gcp_bucket }}
        ENGINE_VERSION: ${{ inputs.engine_version }}
      run: gcloud storage cp --recursive "out/$CONFIG_NAME/zip_archives/"* "gs://$GCP_BUCKET/flutter_infra_release/flutter/engine/$ENGINE_VERSION/"

    - name: Copy engine outputs
      if: ${{ inputs.gcp_bucket != '' && !contains(inputs.config_name, 'test') && hashFiles(format('{0}/engine/src/out/{1}/zip_archives/**', inputs.fork_path, inputs.config_name)) == '' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}/engine/src
      env:
        CONFIG_NAME: ${{ inputs.config_name }}
        GCP_BUCKET: ${{ inputs.gcp_bucket }}
        ENGINE_VERSION: ${{ inputs.engine_version }}
      run: |
        set -euo pipefail
        tar c "out/$CONFIG_NAME" | gzip > "out/$CONFIG_NAME.tar.gz"
        gcloud storage cp --recursive "out/$CONFIG_NAME.tar.gz" "gs://$GCP_BUCKET/flutter_infra_release/flutter/engine/$ENGINE_VERSION/$CONFIG_NAME.tar.gz"
