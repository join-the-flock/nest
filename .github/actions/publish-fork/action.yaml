name: Publish Fork
description: >-
  Force-push an assembled checkout to the selected fork branch, replacing
  the destination branch's history and contents.
inputs:
  fork_path:
    required: false
    default: fork
    description: SDK checkout path relative to the workflow workspace
  destination_repo:
    required: true
    description: Destination GitHub repository (owner/repository)
  destination_branch:
    required: true
    description: Destination branch whose history will be replaced

runs:
  using: composite
  steps:
    - name: Push to destination
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.fork_path }}
      env:
        DESTINATION_REPO: ${{ inputs.destination_repo }}
        DESTINATION_BRANCH: ${{ inputs.destination_branch }}
      run: |
        set -euo pipefail
        git remote add destination "https://github.com/$DESTINATION_REPO"
        git push --force destination "HEAD:refs/heads/$DESTINATION_BRANCH"
