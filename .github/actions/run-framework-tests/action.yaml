name: Run Framework Tests
description: Run the Flutter framework tests using the selected SDK checkout
inputs:
  flutter_path:
    required: true
    description: Absolute SDK checkout path or path relative to the workflow workspace

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Android tools
      shell: bash
      if: runner.os == 'Linux'
      run: sudo apt-get install android-tools-adb

    - name: Run tests
      shell: bash
      env:
        FLUTTER_PATH: ${{ inputs.flutter_path }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        if [[ "$FLUTTER_PATH" != /* ]]; then
          FLUTTER_PATH="$WORKSPACE/$FLUTTER_PATH"
        fi
        FLUTTER_PATH=$(cd "$FLUTTER_PATH" && pwd)
        "$FLUTTER_PATH/bin/flutter" update-packages
        cd "$FLUTTER_PATH/packages/flutter"
        "$FLUTTER_PATH/bin/flutter" test
